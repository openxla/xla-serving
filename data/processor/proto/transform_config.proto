edition = "2024";

package neptune.data.composite;

import "google/protobuf/any.proto";
import "data/resource_manager/proto/resource_manager.proto";

option features.field_presence = IMPLICIT;

message EdgeProto {
  enum SourceType {
    INVALID = 0;
    GRAPH_INPUT = 1;
    NODE_OUTPUT = 2;
    CONSTANT = 3;
  }
  SourceType type = 1;
  int32 source_index = 2;
  int32 port_index = 3;
  google.protobuf.Any constant_value = 4;
}

enum DeviceProto {
  DEVICE_UNSPECIFIED = 0;
  DEVICE_CPU = 1;
  DEVICE_GPU = 2;
}

message TransformConfig {
  // Optional user provided name to identify the transform in a graph holding
  // multiple transforms.
  string name = 1;

  // Name of the transform to register with the transform registry.
  string op_name = 2;
  google.protobuf.Any detail = 3;
  repeated uint64 resource_ids = 4;
  repeated EdgeProto input_edges = 5;
  DeviceProto device = 6;
}


message ShapeDtypeStructProto {
  repeated int64 shape = 1;
  string dtype = 2;
}

message PyTreeProto {
  enum NodeType {
    INVALID = 0;
    LEAF = 1;
    DICT = 2;
    LIST = 3;
    TUPLE = 4;
    NONE = 5;
  }
  NodeType type = 1;
  repeated string dict_keys = 2;
  repeated PyTreeProto children = 3;
  ShapeDtypeStructProto leaf_value = 4;
}

message GraphIOStructureProto {
  PyTreeProto input_structure = 1;
  PyTreeProto output_structure = 2;
  PyTreeProto captured_structure = 3;
}

message CompositeProcessorMetadata {
  int32 version = 1;
}

message CompositeProcessorConfig {
  repeated TransformConfig transforms = 1;
  repeated neptune.data.ResourceProto resources = 2;
  string custom_asset_path = 3;
  repeated EdgeProto output_edges = 4;
  CompositeProcessorMetadata metadata = 5;
  GraphIOStructureProto io_structure = 6;
}
