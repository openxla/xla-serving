edition = "2024";

package neptune.data.composite.transforms;

import "data/processor/cc/utils/default_value.proto";

option features.default_symbol_visibility = STRICT;
option features.field_presence = IMPLICIT;

message BucketPadArgs {
  // Sorted list of pre-determined target bucket dimensions [D_1, D_2, ...,
  // D_n].
  repeated int64 target_dimensions = 1;

  // The dimension index to pad. Defaults to -1 (trailing dimension).
  int32 axis = 2;

  // Fill value for padding. If not set, defaults to 0.
  neptune.data.composite.utils.DefaultValue pad_value = 3;
}
