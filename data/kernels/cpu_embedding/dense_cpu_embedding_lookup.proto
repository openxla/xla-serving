syntax = "proto3";

package xla_serving.data.composite.transforms.cpu_embedding;

// Configuration arguments for DenseCpuEmbeddingLookupTransform.
message DenseCpuEmbeddingLookupArgs {
  // Input feature names corresponding to each dense tensor input.
  repeated string feature_names = 1;

  // Value used to identify padding tokens to filter out during lookup.
  optional int64 pad_value = 2;

  // Optional custom output feature names.
  repeated string output_feature_names = 3;

  // Legacy single feature name field for backward compatibility.
  optional string feature_name = 4;
}

