name: Build Neptune Runtime

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test-runtime:
    name: "Build Neptune Runtime"
    runs-on: linux-x86-n2-32
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for runtime changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            runtime:
              - 'runtime/**'
              - 'data/**'
              - 'protos/**'
              - '.github/workflows/build-runtime.yml'
              - '.bazelrc'
              - 'MODULE.bazel'
              - 'BUILD'

      - name: Setup Bazel
        if: github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true'
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Build Neptune Runtime
        if: github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true'
        env:
          CACHE_CONFIG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
        run: |
          bazel build -c opt //runtime/... //data/... \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no

      - name: Run Runtime Tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true'
        env:
          CACHE_CONFIG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
        run: |
          bazel test -c opt --test_output=errors //runtime/... //data/... \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no
