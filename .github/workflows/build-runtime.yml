name: Build Neptune Runtime

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-test-runtime:
    name: "build-runtime"
    runs-on: linux-x86-n2-32
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build Neptune Runtime
        run: |
          bazel build -c opt //runtime/... \
            --ui_event_filters=-info,-stdout,-stderr \
            --show_progress_rate_limit=30 \
            --curses=no

      - name: Run Runtime Tests
        run: |
          bazel test -c opt --test_output=errors //runtime/... \
            --ui_event_filters=-info,-stdout,-stderr \
            --show_progress_rate_limit=30 \
            --curses=no
