name: Build Neptune Runtime

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-test-runtime:
    name: "build-runtime"
    runs-on: linux-x86-n2-32
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Build Neptune Runtime
        env:
          CACHE_CONFIG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
        run: |
          bazel build -c opt //runtime/... \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no

      - name: Run Runtime Tests
        env:
          CACHE_CONFIG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
        run: |
          bazel test -c opt --test_output=errors //runtime/... \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no
