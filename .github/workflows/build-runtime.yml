name: Build XLA Serving Runtime

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run nightly at 02:00 UTC to refresh the Bazel remote cache ahead of nightly image builds
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test-runtime:
    name: "Build XLA Serving Runtime"
    runs-on: linux-x86-n4-32
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:0ad60e35d5870853c4c463f1c23dff6ed2dbfe3b1f708406c25a7606a5cae078

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for runtime changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            runtime:
              - 'runtime/**'
              - 'data/**'
              - 'protos/**'
              - 'third_party/**'
              - '.github/workflows/build-runtime.yml'
              - '.bazelrc'
              - '.bazelversion'
              - 'MODULE.bazel'
              - 'BUILD'
              - '*.BUILD.bazel'
              - 'version.bzl'

      - name: Setup Bazel
        if: github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true'
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: true

      - name: Build and Test XLA Serving Runtime
        if: github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true'
        env:
          CACHE_CONFIG: ${{ github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
        run: |
          bazel test -c opt --test_output=errors //runtime/... //data/... \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no
