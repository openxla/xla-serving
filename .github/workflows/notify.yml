name: CI Failure Issue Tracker

on:
  workflow_run:
    workflows:
      - "Build XLA SavedModel"
      - "Build XLA Serving Runtime"
      - "Nightly Serving Test (CPU)"
      - "Nightly Serving Test (GPU)"
      - "Nightly Serving Test (TPU)"
      - "Push Nightly XLA Serving Images"
      - "Release XLA Serving"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-failure-issue-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  track-ci-failure:
    name: Update CI Failure Issue
    runs-on: ubuntu-latest
    # Run on postsubmit/scheduled runs on main (ignore PRs, forks, and
    # cancelled/skipped/neutral runs). Catch all failure conclusions (e.g.
    # failure, timed_out, startup_failure, action_required, stale) and
    # auto-close on success.
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.head_repository == null ||
       github.event.workflow_run.head_repository.full_name == github.repository) &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.conclusion != 'neutral'
    steps:
      - name: Create, update, or close tracking GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          LABEL="ci-failure"
          TITLE="[CI Failure] ${WF_NAME}"

          # Query the REST Issues endpoint (reads primary DB directly, no search index lag)
          # and match exact issue title safely via jq --arg (excluding PRs).
          EXISTING_ISSUES=$(gh api --paginate \
            "repos/${GH_REPO}/issues?state=open&labels=${LABEL}&per_page=100" \
            | jq -r --arg title "${TITLE}" '.[] | select(.pull_request == null and .title == $title) | .number')

          if [ "${WF_CONCLUSION}" = "success" ]; then
            for ISSUE_NUM in ${EXISTING_ISSUES}; do
              gh issue close "${ISSUE_NUM}" \
                --repo "${GH_REPO}" \
                --comment "✅ Workflow **${WF_NAME}** succeeded on \`main\` (${WF_URL}). Closing tracking issue."
            done
            exit 0
          fi

          EXISTING_ISSUE=$(printf '%s\n' "${EXISTING_ISSUES}" | head -n 1)

          BODY=$(printf '%s\n\n- **Workflow:** %s\n- **Conclusion:** `%s`\n- **Trigger:** `%s`\n- **Commit:** `%s`\n- **Run URL:** %s\n' \
            "❌ **${WF_NAME}** failed on \`main\`." \
            "${WF_NAME}" "${WF_CONCLUSION}" "${WF_EVENT}" "${WF_SHA}" "${WF_URL}")

          if [ -n "${EXISTING_ISSUE}" ]; then
            gh issue comment "${EXISTING_ISSUE}" \
              --repo "${GH_REPO}" \
              --body "${BODY}"
          else
            # Ensure the ci-failure label exists before creating an issue.
            gh label create "${LABEL}" \
              --repo "${GH_REPO}" \
              --color "d73a4a" \
              --description "Automated CI or nightly workflow failure" \
              --force

            gh issue create \
              --repo "${GH_REPO}" \
              --title "${TITLE}" \
              --label "${LABEL}" \
              --body "${BODY}"
          fi
