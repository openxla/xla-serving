name: Build Neptune Model

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub UI

jobs:
  build-and-test:
    name: "build-model (Python ${{ matrix.python-version }}, jax ${{ matrix.jax-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # TODO(hjswe): Re-enable once the tests are fixed.
        # python-version: ["3.10", "3.11", "3.12"]
        python-version: ["3.12"]
        jax-version: ["newest"]
        # include:
        #   - python-version: "3.10"
        #     jax-version: "0.4.34"  # keep in sync with minimum version in neptune_model/pyproject.toml


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Disable Android configuration
        run: |
          # 1. Clear the variables
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          # 2. Nuke the empty ghost folders so Bazel gives up searching
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/lib/android-sdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0


      - name: Cache Bazel Build
        # This drastically speeds up future builds by caching Bazel's external dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'WORKSPACE') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel grpcio-tools

      - name: Build the Neptune Model Wheel
        run: |
          python -m build --wheel

      - name: Install the Built Wheel
        # The wildcard *.whl will grab whatever version was just built
        run: pip install ./dist/*.whl

      - name: Verify Package Import
        run: |
          # 1. Change directory away from the repository code!
          # This forces Python to use the installed wheel instead of the local files.
          cd /tmp
          # 2. Try importing the package and printing the version
          python -c "
          import neptune_model
          print('✅ Successfully imported neptune_model!')
          print(f'📦 Version: {neptune_model.__version__}')
          "

      - name: Install Test Dependencies and Run Pytest
        run: |
          pip install .[test,tf]
          pytest neptune_model/
