name: Build Neptune Model

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub UI

jobs:
  build-and-test:
    name: "build-model (Python ${{ matrix.python-version }}, jax ${{ matrix.jax-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        jax-version: ["newest"]
        include:
          - python-version: "3.10"
            jax-version: "0.4.34"  # keep in sync with minimum version in model/pyproject.toml


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3


      - name: Cache Bazel Build
        # This drastically speeds up future builds by caching Bazel's external dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'WORKSPACE') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build the Neptune Model Wheel
        env:
          # Tell setup.py that the repo root is the GitHub workspace root!
          NEPTUNE_ROOT_DIR: ${{ github.workspace }}
        working-directory: ./model
        run: |
          # Run the build command we perfected
          python -m build --wheel --no-isolation
