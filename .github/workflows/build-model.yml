name: Build XLA SavedModel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Build Neptune Model (Python ${{ matrix.python-version }}, jax ${{ matrix.jax-version }})"
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    strategy:
      matrix:
        # TODO(hjswe): Re-enable once the tests are fixed.
        # python-version: ["3.10", "3.11", "3.12"]
        python-version: ["3.12"]
        jax-version: ["newest"]
        # include:
        #   - python-version: "3.10"
        #     jax-version: "0.4.35"  # keep in sync with minimum version in xla_saved_model/pyproject.toml

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
          cache-dependency-glob: |
            **/pyproject.toml
            **/setup.py

      - name: Create virtual environment
        run: |
          uv venv --clear --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: true

      - name: Install Python Build Dependencies
        run: |
          uv pip install build setuptools wheel grpcio-tools

      - name: Build neptune_data and neptune_data_test wheels
        env:
          CACHE_CONFIG: ${{ github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
        run: |
          bazel build -c opt //data:neptune_data //data:neptune_data_test \
            --@rules_python//python/config_settings:python_version=${{ matrix.python-version }} \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no

      - name: Install neptune_data and neptune_data_test wheels
        run: |
          uv pip install bazel-bin/data/neptune_data*.whl

      - name: Build the XLA SavedModel Wheel
        run: |
          uv build --wheel

      - name: Install the Built Wheel
        # The wildcard *.whl will grab whatever version was just built
        run: uv pip install ./dist/*.whl

      - name: Verify Package Import
        run: |
          # 1. Change directory away from the repository code!
          # This forces Python to use the installed wheel instead of the local files.
          cd /tmp
          # 2. Try importing the package and printing the version
          python -c "
          import xla_saved_model
          print('✅ Successfully imported xla_saved_model!')
          print(f'📦 Version: {xla_saved_model.__version__}')
          "

      - name: Install Test Dependencies and Run Pytest
        run: |
          uv pip install ".[test,tf,torch]"
          uv pip uninstall triton 2>/dev/null || true
          pytest -v -s --full-trace -n auto xla_saved_model/

      - name: Upload Built Wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xla-saved-model-wheels
          path: |
            bazel-bin/data/neptune_data*.whl
            dist/*.whl
          retention-days: 1

  build-and-test-llm:
    name: "Build Neptune LLM Module (Python ${{ matrix.python-version }}, jax ${{ matrix.jax-version }})"
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    needs: build-and-test
    strategy:
      matrix:
        python-version: ["3.12"]
        jax-version: ["newest"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
          cache-dependency-glob: |
            **/pyproject.toml
            **/setup.py

      - name: Create virtual environment
        run: |
          uv venv --clear --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Download Built Wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xla-saved-model-wheels
          path: wheels

      - name: Install Prebuilt Wheels
        run: |
          find wheels -name "*.whl" -exec uv pip install {} +

      - name: Verify Package Import
        run: |
          cd /tmp
          python -c "
          import xla_saved_model
          print('✅ Successfully imported xla_saved_model!')
          print(f'📦 Version: {xla_saved_model.__version__}')
          "

      - name: Install Test Dependencies and Run Pytest for LLM Module
        env:
          VLLM_TARGET_DEVICE: tpu
        run: |
          uv pip install --pre ".[test]"
          uv pip uninstall triton 2>/dev/null || true
          pytest -v -s -n auto xla_saved_model/_src/llm/
