name: Build Neptune Model

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub UI

permissions: read-all

jobs:
  build-and-test:
    name: "build-model (Python ${{ matrix.python-version }}, jax ${{ matrix.jax-version }})"
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    strategy:
      matrix:
        # TODO(hjswe): Re-enable once the tests are fixed.
        # python-version: ["3.10", "3.11", "3.12"]
        python-version: ["3.12"]
        jax-version: ["newest"]
        # include:
        #   - python-version: "3.10"
        #     jax-version: "0.4.34"  # keep in sync with minimum version in neptune_model/pyproject.toml


    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: |
          uv venv --clear --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Install Python Build Dependencies
        run: |
          uv pip install build setuptools wheel grpcio-tools

      - name: Build neptune_data, neptune_data_test, and neptune_model_runner wheels
        run: |
          bazel build -c opt //data:neptune_data //data:neptune_data_test //runtime/python:neptune_model_runner \
            --@rules_python//python/config_settings:python_version=${{ matrix.python-version }} \
            --ui_event_filters=-info,-stdout,-stderr \
            --noshow_progress

      - name: Install neptune_data, neptune_data_test, and neptune_model_runner wheels
        run: |
          uv pip install bazel-bin/data/neptune_data*.whl bazel-bin/runtime/python/neptune_model_runner*.whl

      - name: Build the Neptune Model Wheel
        run: |
          uv build --wheel

      - name: Install the Built Wheel
        # The wildcard *.whl will grab whatever version was just built
        run: uv pip install ./dist/*.whl

      - name: Verify Package Import
        run: |
          # 1. Change directory away from the repository code!
          # This forces Python to use the installed wheel instead of the local files.
          cd /tmp
          # 2. Try importing the package and printing the version
          python -c "
          import neptune_model
          print('✅ Successfully imported neptune_model!')
          print(f'📦 Version: {neptune_model.__version__}')

          from neptune_model_runner import model_runner
          print('✅ Successfully imported neptune_model_runner!')

          import neptune_data
          print('✅ Successfully imported neptune_data!')

          import neptune_data_test
          print('✅ Successfully imported neptune_data_test!')
          "

      - name: Install Test Dependencies and Run Pytest
        run: |
          uv pip install ".[test,tf,torch]"
          uv pip uninstall triton
          pytest -v -s --full-trace neptune_model/

      - name: Run Neptune Examples
        run: |
          for example_dir in examples/*; do
            if [ -d "$example_dir" ] && [ -f "$example_dir/export_test.py" ]; then
              example_name=$(basename "$example_dir")
              echo "=== Running test for example: ${example_name} ==="
              python -m "examples.${example_name}.export_test"
            fi
          done
