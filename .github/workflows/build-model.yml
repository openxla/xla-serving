name: Build Neptune Model

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub UI

jobs:
  build-and-test:
    name: "build-model (Python ${{ matrix.python-version }}, jax ${{ matrix.jax-version }})"
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    strategy:
      matrix:
        # TODO(hjswe): Re-enable once the tests are fixed.
        # python-version: ["3.10", "3.11", "3.12"]
        python-version: ["3.12"]
        jax-version: ["newest"]
        # include:
        #   - python-version: "3.10"
        #     jax-version: "0.4.34"  # keep in sync with minimum version in neptune_model/pyproject.toml


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Android configuration
        run: |
          # 1. Clear the variables
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          # 2. Nuke the empty ghost folders so Bazel gives up searching
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/lib/android-sdk


      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: |
          uv venv --clear --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0


      - name: Cache Bazel Build
        # This drastically speeds up future builds by caching Bazel's external dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install Python Build Dependencies
        run: |
          uv pip install build setuptools wheel grpcio-tools

      - name: Build neptune_data and neptune_data_test wheels
        run: |
          bazel build //data:neptune_data //data:neptune_data_test --@rules_python//python/config_settings:python_version=${{ matrix.python-version }}

      - name: Install neptune_data and neptune_data_test wheels
        run: |
          uv pip install bazel-bin/data/neptune_data*.whl

      - name: Build the Neptune Model Wheel
        run: |
          uv build --wheel

      - name: Install the Built Wheel
        # The wildcard *.whl will grab whatever version was just built
        run: uv pip install ./dist/*.whl

      - name: Verify Package Import
        run: |
          # 1. Change directory away from the repository code!
          # This forces Python to use the installed wheel instead of the local files.
          cd /tmp
          # 2. Try importing the package and printing the version
          python -c "
          import neptune_model
          print('✅ Successfully imported neptune_model!')
          print(f'📦 Version: {neptune_model.__version__}')
          "

      - name: Install Test Dependencies and Run Pytest
        run: |
          uv pip install ".[test,tf,torch]"
          uv pip uninstall triton
          pytest -v -s --full-trace neptune_model/
