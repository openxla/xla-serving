name: Nightly Serving Test (TPU)

on:
  schedule:
    # Run nightly at 07:00 UTC (after nightly image push at 04:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      image:
        description: 'Docker image to test'
        required: false
        default: 'gcr.io/neptune-serving-engine/tpu-jax-only:nightly'
        type: string
      release_tag:
        description: 'GitHub Release tag for wheels (leave empty for latest release)'
        required: false
        default: ''
        type: string
      runner:
        description: 'Runner label to run on (must have TPU chips attached)'
        required: false
        default: 'linux-x86-ct6e-180-4tpu'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly-test-tpu:
    name: Nightly Serving Test (TPU)
    runs-on: ${{ inputs.runner || 'linux-x86-ct6e-180-4tpu' }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:0ad60e35d5870853c4c463f1c23dff6ed2dbfe3b1f708406c25a7606a5cae078
      # --privileged exposes the TPU device nodes (/dev/accel* or /dev/vfio/*)
      # to the container, same as the other TPU workflows in this GitHub org.
      options: --init --privileged
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /__w/xla-serving/xla-serving
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "*"

      - name: Verify TPU Availability
        run: |
          echo "TPU device nodes:"
          ls -la /dev/accel* /dev/vfio/* 2>/dev/null || echo "No /dev/accel* or /dev/vfio/* device nodes found"

          echo "TPU PCI devices (Google vendor id 0x1ae0):"
          NUM_CHIPS=0
          for vendor in /sys/bus/pci/devices/*/vendor; do
            dev_dir=$(dirname "${vendor}")
            case "${dev_dir}" in *.0) ;; *) continue ;; esac
            if [ "$(cat "${vendor}")" = "0x1ae0" ]; then
              echo "  ${dev_dir} device=$(cat "${dev_dir}/device") driver=$(basename "$(readlink -f "${dev_dir}/driver" 2>/dev/null || echo none)")"
              NUM_CHIPS=$((NUM_CHIPS + 1))
            fi
          done
          echo "Found ${NUM_CHIPS} TPU chip(s)"
          if [ "${NUM_CHIPS}" -eq 0 ]; then
            echo "Error: no TPU chips found on this runner. Pick a TPU runner label via the 'runner' input."
            exit 1
          fi

          # Informational: whether the libtpu runtime can read its topology from
          # the GCE metadata server (Cloud TPU VMs) or must be told explicitly.
          if curl -sf -m 5 -H 'Metadata-Flavor: Google' \
              'http://169.254.169.254/computeMetadata/v1/instance/attributes/tpu-env' > /dev/null; then
            echo "GCE metadata 'tpu-env' attribute: present"
          else
            echo "GCE metadata 'tpu-env' attribute: absent (single-host topology must come from TPU_* env vars)"
          fi

      - name: Install Crane
        run: |
          if ! command -v crane > /dev/null 2>&1; then
            echo "Installing crane..."
            mkdir -p "$HOME/.local/bin"
            curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C "$HOME/.local/bin" crane
            chmod +x "$HOME/.local/bin/crane"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Authenticate to Container Registry
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v gcloud > /dev/null 2>&1; then
            gcloud auth configure-docker gcr.io --quiet || true
            gcloud auth print-access-token | crane auth login -u oauth2accesstoken --password-stdin gcr.io || true
          fi

      - name: Extract and Verify Serving Image
        env:
          IMAGE: ${{ inputs.image || 'gcr.io/neptune-serving-engine/tpu-jax-only:nightly' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Extracting Docker image: ${IMAGE}"
          mkdir -p /tmp/xla-serving
          crane export "${IMAGE}" - | tar -xf - -C /tmp/xla-serving

          echo "Verifying serving binary..."
          ls -la /tmp/xla-serving/runtime/serving/gcp/server/
          test -x /tmp/xla-serving/runtime/serving/gcp/server/xla_serving_main_tpu

          echo "Verifying the image is self-contained (bundled libtpu)..."
          ls -la /tmp/xla-serving/usr/lib/libtpu.so /tmp/xla-serving/usr/share/doc/libtpu/
          test -f /tmp/xla-serving/usr/lib/libtpu.so

          echo "Verifying image config sets TPU_LIBRARY_PATH..."
          crane config "${IMAGE}" > /tmp/image-config.json
          if ! grep -q '"TPU_LIBRARY_PATH=/usr/lib/libtpu.so"' /tmp/image-config.json; then
            echo "Error: image config does not set TPU_LIBRARY_PATH=/usr/lib/libtpu.so:"
            cat /tmp/image-config.json
            exit 1
          fi

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Download Release Wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory /__w/xla-serving/xla-serving || true
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true
          git config --global --add safe.directory "*" || true
          mkdir -p wheels
          if [ -n "${RELEASE_TAG}" ]; then
            echo "Downloading wheels from release: ${RELEASE_TAG} (repo: ${GH_REPO})"
            gh release download "${RELEASE_TAG}" --repo "${GH_REPO}" --pattern "*.whl" --dir wheels
          else
            echo "Downloading wheels from latest release (repo: ${GH_REPO})"
            gh release download --repo "${GH_REPO}" --pattern "*.whl" --dir wheels
          fi
          ls -la wheels/

      - name: Install Release Wheels and Test Dependencies
        run: |
          echo "Installing downloaded wheels..."
          uv pip install wheels/*.whl
          # The NNX example exports a multi-platform (cpu/cuda/tpu) model, so the
          # export runs on CPU JAX. This keeps the TPU chips (and the libtpu
          # lock) free for the serving binary under test, and the prediction
          # client does not need JAX at all.
          uv pip install jax flax grpcio

      - name: Export NNX Example Model
        env:
          JAX_PLATFORMS: cpu
        run: |
          mkdir -p /tmp/exported_model
          rm -rf /tmp/test_workspace && mkdir -p /tmp/test_workspace
          cp -r examples /tmp/test_workspace/
          cd /tmp/test_workspace
          python3 -m examples.nnx.run_export --export_path=/tmp/exported_model
          ls -la /tmp/exported_model

      - name: Start XLA Serving TPU Server and Run End-to-End Prediction Test
        env:
          # `crane export` flattens the filesystem but does not apply the image's
          # ENV, so point the server at the extracted copy of the bundled libtpu
          # exactly as the image's TPU_LIBRARY_PATH would inside `docker run`.
          TPU_LIBRARY_PATH: /tmp/xla-serving/usr/lib/libtpu.so
        run: |
          SERVER_BIN="/tmp/xla-serving/runtime/serving/gcp/server/xla_serving_main_tpu"
          if [ ! -x "${SERVER_BIN}" ]; then
            echo "Error: No executable XLA serving TPU binary (xla_serving_main_tpu) found in extracted image!"
            find /tmp/xla-serving -type f -perm -111
            exit 1
          fi

          PLATFORM_FLAG="--orbax_grpc_server_platform=tpu"

          echo "Starting XLA Serving TPU binary: ${SERVER_BIN} with ${PLATFORM_FLAG}..."
          echo "TPU_LIBRARY_PATH=${TPU_LIBRARY_PATH}"
          env | grep -E '^(TPU_|LIBTPU_)' || true
          "${SERVER_BIN}" \
            ${PLATFORM_FLAG} \
            --model_name=nnx \
            --model_path=/tmp/exported_model \
            --use_insecure_grpc_credentials=true \
            --port=8500 > /tmp/xla-serving.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=${SERVER_PID}" >> $GITHUB_ENV
          echo "Started XLA Serving server with PID ${SERVER_PID}"

          # TPU runtime initialization (driver load, topology discovery, program
          # compilation) takes noticeably longer than CPU/GPU startup.
          echo "Waiting for XLA Serving server to be ready..."
          READY=false
          for i in $(seq 1 180); do
            if grep -q "JAX Serving listening on" /tmp/xla-serving.log 2>/dev/null; then
              echo "XLA Serving TPU server is ready after ${i}s!"
              READY=true
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "XLA Serving TPU server exited prematurely. Server logs:"
              cat /tmp/xla-serving.log || true
              exit 1
            fi
            sleep 1
          done

          if [ "${READY}" != "true" ]; then
            echo "XLA Serving TPU server failed to start within 180s. Server logs:"
            cat /tmp/xla-serving.log || true
            exit 1
          fi

          echo "Running prediction test against TPU serving endpoint..."
          python3 /tmp/test_workspace/examples/nnx/test_prediction_client.py \
            --server_address=localhost:8500 \
            --model_name=nnx \
            --signature_name=serving_default \
            --batch_size=4 \
            --timeout=60

      - name: Clean up Server
        if: always()
        run: |
          if [ -f /tmp/xla-serving.log ]; then
            echo "=== XLA Serving Logs ==="
            cat /tmp/xla-serving.log
          fi
          if [ -n "${SERVER_PID}" ]; then
            kill -9 "${SERVER_PID}" 2>/dev/null || true
          fi
