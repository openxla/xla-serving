name: build-protos

on:
  push:
    branches:
      - main
      - 'test_*'
  pull_request:
    branches:
      - main
      - 'test_*'
  workflow_dispatch:

jobs:
  build:
    name: Bazel Build Protos
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}        

      - name: Compile Protobufs
        # This purely validates that the syntax is correct and Bazel can resolve the graph
        run: |
          echo "Validating pure Bazel proto compilation..."
          bazel build //protos:all