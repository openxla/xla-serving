name: build-protos

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: Bazel Build Protos
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Compile Protobufs
        env:
          CACHE_CONFIG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
        run: |
          echo "Compiling protos with GCS remote cache (${CACHE_CONFIG})..."
          bazel build -c opt //protos:all \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no
