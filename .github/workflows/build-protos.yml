name: build-protos

on:
  push:
    branches:
      - main
      - 'test_*'
  pull_request:
    branches:
      - main
      - 'test_*'
  workflow_dispatch:

jobs:
  build:
    name: Bazel Build Protos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Disable Android configuration
        run: |
          # 1. Clear the variables
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

          # 2. Nuke the empty ghost folders so Bazel gives up searching
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/lib/android-sdk

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Cache Bazel Build
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-protos-${{ hashFiles('MODULE.bazel', 'WORKSPACE') }}
          restore-keys: |
            ${{ runner.os }}-bazel-protos-

      - name: Compile Protobufs
        # This purely validates that the syntax is correct and Bazel can resolve the graph
        run: |
          echo "Validating pure Bazel proto compilation..."
          bazel build //protos:all