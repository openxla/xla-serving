name: build-protos

on:
  push:
    branches:
      - main
      - 'test_*'
  pull_request:
    branches:
      - main
      - 'test_*'
  workflow_dispatch:

jobs:
  build:
    name: Bazel Build Protos
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Android configuration
        run: |
          # 1. Clear the variables
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

          # 2. Nuke the empty ghost folders so Bazel gives up searching
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/lib/android-sdk

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Cache Bazel Build
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-protos-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-protos-

      - name: Compile Protobufs
        # This purely validates that the syntax is correct and Bazel can resolve the graph
        run: |
          echo "Validating pure Bazel proto compilation..."
          bazel build //protos:all