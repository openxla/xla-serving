name: Push Nightly XLA Serving Images

on:
  schedule:
    # Run nightly at 04:00 UTC (8 PM PST / 9 PM PDT)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Primary Docker tag to push'
        required: false
        default: 'nightly'
        type: string
      add_latest_tag:
        description: 'Also tag as latest'
        required: false
        default: false
        type: boolean
      variant:
        description: 'Image variant to build and push'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'cpu-jax-only'
          - 'cpu-jax-with-tf'
          - 'gpu-jax-cuda12'
          - 'gpu-jax-cuda12-with-tf'
          - 'gpu-jax-cuda13'
          - 'gpu-jax-cuda13-with-tf'
          - 'tpu-jax-only'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-serving-images:
    name: "Push ${{ matrix.variant.name }}"
    runs-on: linux-x86-n4-32
    defaults:
      run:
        shell: bash
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:0ad60e35d5870853c4c463f1c23dff6ed2dbfe3b1f708406c25a7606a5cae078
    strategy:
      fail-fast: false
      matrix:
        variant:
          - id: cpu-jax-only
            name: "CPU JAX"
            target: "//runtime/serving/gcp/server:xla_serving_pusher"
            flags: "-c opt"
            repository: "us-docker.pkg.dev/xla-serving-engine/xla-serving/cpu-jax-only"
          - id: cpu-jax-with-tf
            name: "CPU JAX + TF"
            target: "//runtime/serving/gcp/server:xla_serving_pusher"
            flags: "-c opt --define ENABLE_TF=1"
            repository: "us-docker.pkg.dev/xla-serving-engine/xla-serving/cpu-jax-with-tf"
          - id: gpu-jax-cuda12
            name: "CUDA 12 JAX"
            target: "//runtime/serving/gcp/server:xla_serving_pusher_gpu"
            flags: "-c opt --config=cuda_v12 --verbose_failures"
            repository: "us-docker.pkg.dev/xla-serving-engine/xla-serving/gpu-jax-cuda12"
          - id: gpu-jax-cuda12-with-tf
            name: "CUDA 12 JAX + TF"
            target: "//runtime/serving/gcp/server:xla_serving_pusher_gpu"
            flags: "-c opt --config=cuda_v12 --define ENABLE_TF=1 --verbose_failures"
            repository: "us-docker.pkg.dev/xla-serving-engine/xla-serving/gpu-jax-cuda12-with-tf"
          - id: gpu-jax-cuda13
            name: "CUDA 13 JAX"
            target: "//runtime/serving/gcp/server:xla_serving_pusher_gpu"
            flags: "-c opt --config=cuda_v13 --verbose_failures"
            repository: "us-docker.pkg.dev/xla-serving-engine/xla-serving/gpu-jax-cuda13"
          - id: gpu-jax-cuda13-with-tf
            name: "CUDA 13 JAX + TF"
            target: "//runtime/serving/gcp/server:xla_serving_pusher_gpu"
            flags: "-c opt --config=cuda_v13 --define ENABLE_TF=1 --verbose_failures"
            repository: "us-docker.pkg.dev/xla-serving-engine/xla-serving/gpu-jax-cuda13-with-tf"
          - id: tpu-jax-only
            name: "TPU JAX"
            target: "//runtime/serving/gcp/server:xla_serving_pusher_tpu"
            flags: "-c opt"
            repository: "us-docker.pkg.dev/xla-serving-engine/xla-serving/tpu-jax-only"



    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant.id
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bazel
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant.id
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: true

      - name: Configure Docker Authentication
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant.id
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant.id
        env:
          INPUT_TAG: ${{ inputs.tag }}
          ADD_LATEST_TAG: ${{ inputs.add_latest_tag }}
          CACHE_CONFIG: ${{ github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
          FLAGS: ${{ matrix.variant.flags }}
          TARGET: ${{ matrix.variant.target }}
          REPOSITORY: ${{ matrix.variant.repository }}
        run: |
          TAG_ARGS=()
          PRIMARY_TAG="${INPUT_TAG:-nightly}"
          TAG_ARGS+=("--tag=${PRIMARY_TAG}")

          if [ "${ADD_LATEST_TAG}" = "true" ] && [ "${PRIMARY_TAG}" != "latest" ]; then
            TAG_ARGS+=("--tag=latest")
          fi

          # shellcheck disable=SC2086
          bazel run ${FLAGS} \
            --config="${CACHE_CONFIG}" \
            --local_ram_resources=80000 \
            --output_filter=DONT_MATCH_ANYTHING \
            --show_progress_rate_limit=30 \
            --curses=no \
            "${TARGET}" -- \
            --repository="${REPOSITORY}" \
            "${TAG_ARGS[@]}"

      - name: Prune Superseded Untagged Digests
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant.id
        env:
          REPOSITORY: ${{ matrix.variant.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["REPOSITORY"]
          out = subprocess.check_output(
              [
                  "gcloud",
                  "artifacts",
                  "docker",
                  "images",
                  "list",
                  repo,
                  "--include-tags",
                  "--format=json",
              ],
              text=True,
          )
          untagged = [
              item["version"]
              for item in json.loads(out)
              if item.get("package") == repo
              and not item.get("tags")
              and item.get("version", "").startswith("sha256:")
          ]
          if not untagged:
              print(f"No untagged digests to prune in {repo}.")
          for digest in untagged:
              uri = f"{repo}@{digest}"
              print(f"Pruning untagged digest {uri}...")
              res = subprocess.run(
                  ["gcloud", "artifacts", "docker", "images", "delete", uri, "--quiet"],
                  check=False,
              )
              if res.returncode != 0:
                  sha_hex = digest.removeprefix("sha256:").lower()
                  dep_tag = f"{repo}:deprecated-public-image-{sha_hex}"
                  print(f"Delete unavailable; tagging {uri} as {dep_tag}...")
                  subprocess.run(
                      ["gcloud", "artifacts", "docker", "tags", "add", uri, dep_tag, "--quiet"],
                      check=True,
                  )
          PY
