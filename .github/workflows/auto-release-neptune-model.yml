name: Auto-Release Neptune Model

on:
  push:
    branches: [ "main" ] # Triggers automatically when code is merged to main
  workflow_dispatch:

# CRITICAL PERMISSIONS
permissions:
  contents: write    # Required to create the GitHub Release

jobs:
  # ==========================================
  # JOB 1: THE SCOUT
  # ==========================================
  check-version:
    name: Check Version
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest

    # We must explicitly map the step outputs to Job outputs so Job 2 can see them
    outputs:
      is_new: ${{ steps.release_check.outputs.is_new }}
      version: ${{ steps.version_check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Version in version.bzl
        id: version_check
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'''VERSION\s*=\s*['\"]([^'\"]+)['\"]''', open('version.bzl').read()).group(1))")
          echo "Found version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Release Already Exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version_check.outputs.version }}" > /dev/null 2>&1; then
            echo "Release already exists. Skipping build."
            echo "is_new=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected!"
            echo "is_new=true" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # JOB 2: THE BUILDER
  # ==========================================
  build-and-publish:
    name: Build and Publish
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    # 1. Wait for Job 1 to finish
    needs: check-version
    # 2. ONLY run this entire job if Job 1 found a new version
    if: needs.check-version.outputs.is_new == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          uv venv --clear --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Cache Bazel Build
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install Python Build Dependencies
        run: |
          uv pip install build setuptools wheel grpcio-tools

      - name: Test and Build neptune_data wheels
        run: |
          bazel test //data/... --@rules_python//python/config_settings:python_version=3.12
          bazel build //data:neptune_data //data:neptune_data_test --@rules_python//python/config_settings:python_version=3.12

      - name: Install neptune_data and neptune_data_test wheels
        run: |
          uv pip install bazel-bin/data/neptune_data*.whl

      - name: Build the Neptune Model Wheel
        run: |
          uv build --wheel

      - name: Install the Built Wheel
        run: uv pip install ./dist/*.whl

      - name: Verify Package Import
        run: |
          cd /tmp
          python -c "
          import neptune_model
          print('✅ Successfully imported neptune_model!')
          print(f'📦 Version: {neptune_model.__version__}')
          "

      - name: Install Test Dependencies and Run Pytest
        run: |
          uv pip install ".[test,tf,torch]"
          uv pip uninstall triton
          pytest neptune_model/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"
          gh release create "$VERSION" \
            dist/*.whl \
            bazel-bin/data/neptune_data*.whl \
            --title "Neptune $VERSION" \
            --generate-notes
