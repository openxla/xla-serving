name: Auto-Release Neptune Model

on:
  push:
    branches: [ "main" ] # Triggers automatically when code is merged to main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Set minimal default permissions at workflow level
permissions:
  contents: read

jobs:
  check-version:
    name: Check Version
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]

    # We must explicitly map the step outputs to Job outputs so Job 2 can see them
    outputs:
      is_new: ${{ steps.release_check.outputs.is_new }}
      version: ${{ steps.version_check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Detect Version in version.bzl
        id: version_check
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'''VERSION\s*=\s*['\"]([^'\"]+)['\"]''', open('version.bzl').read()).group(1))")
          echo "Found version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Release Already Exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_check.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release already exists. Skipping build."
            echo "is_new=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected!"
            echo "is_new=true" >> $GITHUB_OUTPUT
          fi

  build-and-publish:
    name: Build and Publish
    runs-on: linux-x86-n2-16
    permissions:
      contents: write # Required to create the GitHub Release
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: auto
          cache-dependency-glob: |
            **/pyproject.toml
            **/setup.py

      - name: Create virtual environment
        run: |
          uv venv --clear --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Install Python Build Dependencies
        run: |
          uv pip install build setuptools wheel grpcio-tools

      - name: Test and Build neptune_data and neptune_model_runner wheels
        env:
          CACHE_CONFIG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'remote_cache_readwrite' || 'remote_cache_readonly' }}
        run: |
          bazel test -c opt //data/... \
            --@rules_python//python/config_settings:python_version=3.12 \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no
          bazel build -c opt //data:neptune_data //data:neptune_data_test //runtime/python:neptune_model_runner \
            --@rules_python//python/config_settings:python_version=3.12 \
            --config=${CACHE_CONFIG} \
            --output_filter=DONT_MATCH_ANYTHING \
            --ui_event_filters=-warning \
            --show_progress_rate_limit=30 \
            --curses=no

      - name: Install neptune_data, neptune_data_test, and neptune_model_runner wheels
        run: |
          uv pip install bazel-bin/data/neptune_data*.whl bazel-bin/runtime/python/neptune_model_runner*.whl

      - name: Build the Neptune Model Wheel
        run: |
          uv build --wheel

      - name: Install the Built Wheel
        run: uv pip install ./dist/*.whl

      - name: Verify Package Import
        run: |
          cd /tmp
          python -c "
          import neptune_model
          print('✅ Successfully imported neptune_model!')
          print(f'📦 Version: {neptune_model.__version__}')

          from neptune_model_runner import model_runner
          print('✅ Successfully imported neptune_model_runner!')
          "

      - name: Install Test Dependencies and Run Pytest
        run: |
          uv pip install ".[test,tf,torch]"
          uv pip uninstall triton
          pytest -v -n auto neptune_model/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.check-version.outputs.version }}
        run: |
          git config --global --add safe.directory /__w/neptune/neptune
          gh release create "$VERSION" \
            dist/*.whl \
            bazel-bin/data/neptune_data*.whl \
            bazel-bin/runtime/python/neptune_model_runner*.whl \
            --title "Neptune $VERSION" \
            --generate-notes
