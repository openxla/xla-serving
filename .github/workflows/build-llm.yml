name: Build Neptune LLM Module

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-test-llm:
    name: "build-llm (Python ${{ matrix.python-version }}, jax ${{ matrix.jax-version }})"
    runs-on: linux-x86-n2-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest

    strategy:
      matrix:
        # TODO(hjswe): Re-enable once the tests are fixed.
        # python-version: ["3.10", "3.11", "3.12"]
        python-version: ["3.12"]
        jax-version: ["newest"]
        # include:
        #   - python-version: "3.10"
        #     jax-version: "0.4.34"  # keep in sync with minimum version in neptune_model/pyproject.toml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Disable Android configuration
        run: |
          # 1. Clear the variables
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          # 2. Nuke the empty ghost folders so Bazel gives up searching
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/lib/android-sdk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Cache Bazel Build
        # This drastically speeds up future builds by caching Bazel's external dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel grpcio-tools

      - name: Build the Neptune Model Wheel
        run: |
          python -m build --wheel

      - name: Install the Built Wheel
        # The wildcard *.whl will grab whatever version was just built
        run: pip install ./dist/*.whl

      - name: Verify Package Import
        run: |
          # 1. Change directory away from the repository code!
          # This forces Python to use the installed wheel instead of the local files.
          cd /tmp
          # 2. Try importing the package and printing the version
          python -c "
          import neptune_model
          print('✅ Successfully imported neptune_model!')
          print(f'📦 Version: {neptune_model.__version__}')
          "

      - name: Install vLLM TPU
        run: uv pip install --system vllm-tpu

      - name: Install Test Dependencies and Run Pytest for LLM Module
        # TODO(armandouv): Enable running tpu-inference tests on real TPUs.
        env:
          VLLM_TARGET_DEVICE: tpu
        run: |
          pip install --pre .[test]
          pytest neptune_model/_src/llm/
