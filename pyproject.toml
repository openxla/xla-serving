[build-system]
requires = [
  "grpcio-tools",
  "setuptools>=61.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "xla-saved-model"
description = "XLA SavedModel"
readme = 'README.md'
license = {file = 'LICENSE'}
requires-python = '>=3.10'
authors = [{name = 'XLA Serving Authors', email='obm-jsv-team@google.com'}]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Programming Language :: Python',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]

keywords = ["JAX machine learning", "serialization", "export"]

dependencies = [
    'absl-py',
    'dataclasses-json',
    'etils',
    'jax >= 0.4.35',
    'jaxlib',
    'jaxtyping',
    'numpy',
    'protobuf',
    'rich == 14.3.0',  # Pin to avoid rich.table import issue.
    'orbax-checkpoint >= 0.9.0',
    'typer',
]

dynamic = ['version']

[project.urls]
homepage = 'http://github.com/AI-Hypercomputer/xla-serving'
repository = 'http://github.com/AI-Hypercomputer/xla-serving'

[project.scripts]
xsm-cli = 'xla_saved_model.cli.xsm_cli:run'
xsm-llm-export = 'xla_saved_model._src.llm.export_llm:main'

# TODO: Figure out why composite_processor_test.py is failing on GitHub only.
[tool.pytest.ini_options]
addopts = "--ignore=xla_saved_model/protos --ignore=data --ignore=xla_saved_model/_src/llm"

[project.optional-dependencies]

tf = [
    'tensorflow>=2.15.0',
    'tf_keras',
]

tokenizers = [
    'keras-hub',
    'transformers',
]


torch = [
    'torch < 2.13.0',
    'torchax',
]

llm = [
    'vllm-tpu',
    'keras-hub',
    'transformers',
    'tensorflow>=2.15.0',
    'tensorflow-text>=2.15.0',
    'tf_keras',
    'pytest',
]


test = [
    'chex',
    'flax',
    'grpcio',
    'pytest',
    'pytest-xdist',
    'requests',
    'keras-hub',
    'transformers',
]
