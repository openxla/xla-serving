[build-system]
requires = [
  "grpcio-tools",
  "setuptools>=61.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "neptune-model"
description = "Neptune Model"
readme = 'README.md'
license = {file = 'LICENSE'}
requires-python = '>=3.10'
authors = [{name = 'Neptune Authors', email='obm-jsv-team@google.com'}]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Programming Language :: Python',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]

keywords = ["JAX machine learning", "serialization", "export"]

dependencies = [
    'absl-py',
    'dataclasses-json',
    'etils',
    'jax >= 0.4.34',
    'jaxlib',
    'jaxtyping',
    'numpy',
    'protobuf',
    'rich == 14.3.0',  # Pin to avoid rich.table import issue.
    'orbax-checkpoint >= 0.9.0',
    'typer',
]

dynamic = ['version']

[project.urls]
homepage = 'http://github.com/AI-Hypercomputer/neptune'
repository = 'http://github.com/AI-Hypercomputer/neptune'

[project.scripts]
npt-cli = 'neptune_model.cli.npt_cli:run'

[tool.pytest.ini_options]
addopts = "--ignore=neptune_model/protos"

[project.optional-dependencies]

tf = [
    'tensorflow>=2.15.0',
    'tf_keras',
]

torch = [
    'torch<2.13.0',
    'torchax',
]


test = [
    'chex',
    'flax',
    'pytest',
    'pytest-xdist',
    'requests',
    'tf-nightly',
]
