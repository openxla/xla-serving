edition = "2024";

package neptune.serving;

import "runtime/serving/gcp/proto/get_model_metadata.proto";
import "runtime/serving/gcp/proto/predict.proto";

// PredictionService provides access to machine-learned models loaded by
// model_servers.
service PredictionService {
  // Predict.
  rpc Predict(PredictRequest) returns (PredictResponse) {
    // Predict RPC deadline can either be user-facing or batch, so we set a
    // default deadline of 10 minutes which should be acceptable for both.
    
  }

  // GetModelMetadata - provides access to metadata for loaded models.
  rpc GetModelMetadata(GetModelMetadataRequest)
      returns (GetModelMetadataResponse) {
    
  }
}
