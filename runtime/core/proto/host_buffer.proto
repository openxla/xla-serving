edition = "2024";

package jsv;

import "third_party/tensorflow/compiler/xla/python/ifrt/dtype.proto";
import "third_party/tensorflow/compiler/xla/python/ifrt/shape.proto";

// Proto representation of the jsv::HostBuffer.
message HostBufferProto {
  // The data type of the elements in the buffer.
  xla.ifrt.DTypeProto dtype = 1;

  // The shape of the buffer.
  xla.ifrt.ShapeProto shape = 2;

  // The actual buffer data.
  oneof data {
    // Raw byte data for non-string types.
    bytes raw_data = 3;

    // String data for string data types.
    StringArray string_data = 4;
  }
}

// Wrapper for a repeated string field, used when dtype is str.
message StringArray {
  repeated string elements = 1;
}
