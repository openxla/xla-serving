edition = "2024";

package neptune.serving;

import "protos/grpc/host_buffer.proto";
import "protos/grpc/model.proto";

// PredictRequest specifies which model to run, as well as
// how inputs are mapped to tensors and how outputs are filtered before
// returning to user.
message PredictRequest {
  // Model Specification.
  ModelSpec model_spec = 1;

  // Input tensors.
  // Names of input tensor are alias names. The mapping from aliases to real
  // input tensor names is stored in the SavedModel export as a prediction
  // SignatureDef under the 'inputs' field.
  map<string, neptune.HostBufferProto> inputs = 2;
}

// Response for PredictRequest on successful run.
message PredictResponse {
  // Effective Model Specification used to process PredictRequest.
  ModelSpec model_spec = 2;

  // Output tensors.
  map<string, neptune.HostBufferProto> outputs = 1;
}
