// LINT: LEGACY_NAMES

syntax = "proto3";

package xla_saved_model_jax_supplemental;

message Function {
  // Refinements of the input tensor specs.
  //
  // See `ShapeDTypeRefinement` for the meaning of an "refinement".
  //
  // Absence indicates no input specs need to be refined.
  optional ShapeDTypeRefinements input_spec_refinements = 1;

  // Refinements of the output tensor specs.
  //
  // See `ShapeDTypeRefinement` for the meaning of an "refinement".
  //
  // Absence indicates no output specs need to be refined.
  optional ShapeDTypeRefinements output_spec_refinements = 2;

  int32 nr_devices = 3;
  repeated string ordered_effects = 4;
  repeated string unordered_effects = 5;
  repeated DisabledSafetyCheck disabled_checks = 6;
  bool uses_shape_polymorphism = 7;

  // The name of the original JAX function.
  string name = 8;

  // The PyTree structure of the function's inputs and outputs.
  //
  // `manifest.pb` describes these structures with a framework-neutral `Type`,
  // which can express tuples, lists, dicts and `None`, but has no
  // representation for a custom PyTree node (for example a
  // `flax.struct.dataclass`). Such a node is written to `manifest.pb` as a
  // plain list of its leaves, which loses the node's identity. A caller that
  // reconstructs the calling convention from `manifest.pb` alone therefore
  // builds a `list` where the original function expects the custom node, and
  // the call is rejected even though every leaf matches.
  //
  // These fields record the original structure so it can be restored. Like the
  // refinements above, they refine `manifest.pb` and must not contradict it:
  // the leaves, in order, are exactly the tensors described there.
  //
  // Absence means the structure in `manifest.pb` is already exact. That is the
  // case for any signature without custom nodes, for artifacts written before
  // these fields existed, and for signatures whose custom nodes were not
  // registered for serialization at export time.
  optional PyTreeDef input_tree = 9;
  optional PyTreeDef output_tree = 10;
}

// A serialized `jax.tree_util.PyTreeDef`.
//
// This mirrors the representation JAX itself uses to serialize the `in_tree`
// and `out_tree` of a `jax.export.Exported` (see the `PyTreeDef` table in
// `jax/_src/export/serialization.py`), so that the two stay aligned.
message PyTreeDef {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    LEAF = 1;
    NONE = 2;
    TUPLE = 3;
    LIST = 4;
    DICT = 5;
    CUSTOM = 6;
  }

  Kind kind = 1;

  // The node's children, in flattening order. Empty for LEAF and NONE.
  repeated PyTreeDef children = 2;

  // DICT only. The key of each child, in the same order as `children`. JAX
  // sorts dictionary keys when flattening, so these are sorted.
  repeated string children_names = 3;

  // CUSTOM only. The name the node type was registered under via
  // `pytree_proto.register_pytree_node_serialization`. Deserialization
  // resolves the type by looking up this name in the reading process's
  // registry. It is deliberately not a Python import path: an artifact must
  // not be able to cause an arbitrary module to be imported, and a registered
  // name stays stable when code moves.
  string custom_name = 4;

  // CUSTOM only. The node's auxiliary data, produced by the `serialize_auxdata`
  // callback supplied at registration and consumed by the matching
  // `deserialize_auxdata`. Opaque to this proto, so auxiliary data that has no
  // natural textual form (a dtype, say) is representable.
  bytes custom_auxdata = 5;
}

message ShapeDTypeRefinements {
  oneof case {
    ShapeDTypeRefinementList list = 1;
    ShapeDTypeRefinementMap map = 2;
  }
}

message ShapeDTypeRefinementList {
  repeated ShapeDTypeRefinement refinements = 1;
}

message ShapeDTypeRefinementMap {
  map<uint64, ShapeDTypeRefinement> idx_to_refinement = 1;
}

// A refinement of a tensor spec.
//
// For each tensor spec in manifest.pb, JAX may want to provide
// a more precise version of it. For examples, manifest.pb may
// say tensor `Foo`'s dtype is `bool` while JAX may want to say it's actually
// `float0`; manifest.pb may say tensor `Bar`'s shape is `[None, 4]` while JAX
// may want to say it's actually `["b", 4]`. Note that JAX's information
// cannot contradict manifest.pb's, i.e. it can only be a
// refinement.
//
// Anywhere in an refinement, a `None` indicates that this part doesn't need to
// be refined.
message ShapeDTypeRefinement {
  // Absence indicates the corresponding `Shape` doesn't need to be
  // refined.
  optional ShapeRefinement shape = 1;

  // Absence indicates the corresponding `DType` doesn't need to be
  // refined.
  optional DTypeRefinement dtype = 2;
}

message ShapeRefinement {
  repeated DimensionSizeRefinement dimension_sizes = 1;
}

message DimensionSizeRefinement {
  // We use string instead of int here in order to support shape polymorphism
  // and symbolic shapes.
  //
  // Absence indicates the corresponding
  // `DimensionSize` doesn't need to be refined.
  optional string size = 1;
}

enum DTypeRefinement {
  f0 = 0;  // float0
}

message DisabledSafetyCheck {
  message Platform {}

  message CustomCall {
    string target_name = 1;
  }

  message ShapeAssertions {}

  oneof value {
    Platform platform = 1;
    CustomCall custom_call = 2;
    ShapeAssertions shape_assertions = 3;
  }
}
