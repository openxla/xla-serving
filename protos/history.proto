syntax = "proto3";

package neptune_model_history;

// A single configuration change entry.
message Change {
  string previous_value = 1;
  string new_value = 2;
}

// A record of an operation performed on a model bundle.
message HistoryRecord {
  string action = 1;
  string timestamp = 2;
  string user = 3;
  string description = 4;
  map<string, Change> changes = 5;
  string command = 6;
}

// Complete modification history of a model bundle.
message ModelHistory {
  string model_version = 1;
  repeated HistoryRecord records = 2;
}
