syntax = "proto3";

package neptune_assets;

option java_multiple_files = true;

// Defines a map from original asset paths to their new locations within the
// Neptune model. The original paths are retained in case they're referenced
// somewhere in the model: in that case, the runtime will have to overwrite
// them with the destinations from this map.
message AssetMap {
  // Key: The original path (or name) of an asset at the time of export.
  // Value: The relative path of the asset within the Neptune model directory.
  map<string, string> assets = 1;
}
